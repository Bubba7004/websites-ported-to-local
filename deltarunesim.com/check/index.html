:root { --bg: #000; --fg: #fff; --sel: #ffff00; --dim: #9a9a9a; --hit: #ff3b3b; --ok: #5ef08a; --grid: rgba(96, 56, 128, .22); color-scheme: dark; }
html { min-height: 100%; background-color: var(--bg);
background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px); background-size: 40px 40px; }
body { margin: 0; color: var(--fg); font: 16px/24px 'DR Main', monospace; -webkit-font-smoothing: none; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
a { color: var(--sel); text-underline-offset: 4px; }
.home { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none; color: var(--fg); }
.home svg { width: 21px; height: 21px; }
.top { text-align: center; margin: 40px 0 36px; }
.top svg { width: 48px; height: 48px; display: block; margin: 0 auto 16px; }
h1 { font-size: 48px; line-height: 48px; font-weight: normal; margin: 0; }
.lede { color: var(--dim); margin: 16px 0 0; }
/* the Dark World text box: a white line, black inside, the dim ring outside */
.box { background: #000; border: 4px solid #fff; box-shadow: 0 0 0 4px #000, 0 0 0 8px #404040; padding: 8px 20px; margin: 0 0 32px; }
ul { list-style: none; margin: 0; padding: 0; }
li { display: grid; grid-template-columns: 28px 1fr auto; gap: 0 12px; align-items: baseline; padding: 14px 0; border-top: 2px dashed #333; }
li:first-child { border-top: 0; }
.mark { text-align: center; color: var(--dim); }
.state { color: var(--dim); text-align: right; }
.why { grid-column: 2 / 4; color: var(--dim); }
li.ok .mark, li.ok .state { color: var(--ok); }
li.bad .mark, li.bad .state { color: var(--hit); }
li.warn .mark, li.warn .state { color: var(--sel); }
#verdict { padding: 16px 20px; }
#verdict p { margin: 8px 0; }
#verdict b { color: var(--sel); font-weight: normal; }
#verdict .ask { font-size: 32px; line-height: 40px; color: #fff; }
#verdict code { font: inherit; color: var(--sel); }
.row { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
button, .btn { cursor: pointer; background: #000; color: #fff; border: 4px solid #fff; min-height: 56px; padding: 0 22px; font: 16px/1 'DR Main', monospace; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
.btn.go { color: var(--sel); border-color: var(--sel); }
button:hover, button:focus-visible, .btn:hover, .btn:focus-visible { color: var(--sel); border-color: var(--sel); outline: none; }
button[disabled] { color: var(--dim); border-color: var(--dim); cursor: default; }
.fine { color: var(--dim); text-align: center; margin: 28px 0 0; }
.nojs { border: 4px solid #fff; padding: 12px 16px; }
@media (max-width: 560px) { h1 { font-size: 32px; line-height: 32px; } #verdict .ask { font-size: 16px; line-height: 24px; } .row .btn, .row button { flex: 1 1 100%; justify-content: center; } }
